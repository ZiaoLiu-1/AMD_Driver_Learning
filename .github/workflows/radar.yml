name: Update upstream radar feed

on:
  schedule:
    # Daily at 05:17 UTC (odd minute to avoid the top-of-hour cron stampede)
    - cron: '17 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write # to dispatch deploy.yml after the data commit

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate feed
        run: node scripts/update-radar-feed.mjs

      - name: Commit refreshed feed
        id: commit
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/radar/feed.json
          if git diff --cached --quiet; then
            echo "Feed unchanged, nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(radar): daily upstream feed refresh"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN pushes do not trigger `on: push` workflows, so kick
      # the deploy explicitly whenever fresh data landed.
      - name: Trigger deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

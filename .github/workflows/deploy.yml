name: Test & Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Use npm to install pnpm — avoids corepack/packageManager hash issues
      - name: Install pnpm
        run: npm install -g pnpm@10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check

      - name: Run tests
        run: pnpm run test

  deploy:
    name: Build & Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd ${{ secrets.SERVER_PATH }}

            echo "→ Syncing to latest main..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Setting up Node/pnpm via nvm..."
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            nvm use 20 || nvm use default

            echo "→ Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "→ Building for /amd/ base path..."
            NODE_ENV=production pnpm run build

            echo "→ Reloading nginx..."
            sudo nginx -t && sudo systemctl reload nginx

            echo "✓ Deploy complete — site live at https://ziaoliu.io/amd/"
